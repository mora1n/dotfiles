# Adapted from dracula/yazi; see README.md for upstream provenance.
#:schema https://yazi-rs.github.io/schemas/theme.json

[app]
overall = { fg = "#f8f8f2", bg = "#282a36" }

[indicator]
parent = { fg = "#f8f8f2", bg = "#44475a", italic = true }
current = { fg = "#f8f8f2", bg = "#44475a", italic = true }
preview = { underline = true }


# : Manager {{{

[mgr]
cwd = { fg = "#8be9fd" }

# Find
find_keyword  = { fg = "#f1fa8c", bold = true, italic = true, underline = true }
find_position = { fg = "#ff79c6", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#282a36", bg = "#50fa7b" }
marker_cut      = { fg = "#ff5555", bg = "#ff5555" }
marker_marked   = { fg = "#8be9fd", bg = "#8be9fd" }
marker_selected = { fg = "#f1fa8c", bg = "#f1fa8c" }

# Count
count_copied   = { fg = "#282a36", bg = "#50fa7b" }
count_cut      = { fg = "#282a36", bg = "#ff5555" }
count_selected = { fg = "#282a36", bg = "#f1fa8c" }

# Border
border_symbol = "│"
border_style  = { fg = "#6272a4" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#282a36", bg = "#bd93f9", bold = true }
inactive = { fg = "#bd93f9", bg = "#44475a" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#282a36", bg = "#bd93f9", bold = true }
normal_alt  = { fg = "#bd93f9", bg = "#44475a" }

# Select mode
select_main = { fg = "#282a36", bg = "#8be9fd", bold = true }
select_alt  = { fg = "#8be9fd", bg = "#44475a" }

# Unset mode
unset_main = { fg = "#282a36", bg = "#ffb86c", bold = true }
unset_alt  = { fg = "#ffb86c", bg = "#44475a" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#6272a4" }
perm_type  = { fg = "#bd93f9" }
perm_read  = { fg = "#f1fa8c" }
perm_write = { fg = "#ff5555" }
perm_exec  = { fg = "#50fa7b" }

# Progress
progress_label  = { fg = "#f8f8f2", bold = true }
progress_normal = { fg = "#50fa7b", bg = "#44475a" }
progress_error  = { fg = "#f1fa8c", bg = "#ff5555" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#bd93f9" }
active   = { fg = "#ff79c6", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#bd93f9" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#bd93f9" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#bd93f9" }
title   = {}
hovered = { fg = "#ff79c6", bold = true }

# : }}}


# : Which {{{

[which]
border          = { fg = "#bd93f9" }
cand            = { fg = "#8be9fd" }
rest            = { fg = "#6272a4" }
desc            = { fg = "#ff79c6" }
separator       = "  "
separator_style = { fg = "#6272a4" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#8be9fd" }
run     = { fg = "#ff79c6" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#44475a", bg = "#f8f8f2" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#bd93f9" }
title    = { fg = "#bd93f9" }
tbl_col  = { fg = "#8be9fd" }
tbl_cell = { fg = "#ff79c6", bg = "#44475a" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#50fa7b" }
title_warn  = { fg = "#f1fa8c" }
title_error = { fg = "#ff5555" }

# : }}}



[filetype]
rules = [
	{ url = "**/.env*", fg = "#50fa7b", bold = true },
	{ url = "**/.git*", fg = "#ff5555", italic = true },
	{ url = "**/.docker*", fg = "#8be9fd", bold = true },
	{ url = "**/package.json", fg = "#ff5555", bold = true },
	{ url = "**/package-lock.json", fg = "#ff5555", italic = true },
	{ url = "**/composer.json", fg = "#ff79c6", bold = true },
	{ url = "**/Cargo.toml", fg = "#ff7043", bold = true },
	{ url = "**/LICENSE*", fg = "#50fa7b", bold = true },
	{ url = "**/README*", fg = "#50fa7b", bold = true },
	{ url = "**/node_modules/", fg = "#6272a4" },
	{ url = "**/.git/", fg = "#ff5555" },
	{ url = "**/.github/", fg = "#bd93f9" },
	{ url = "**/dist/", fg = "#6272a4" },
	{ url = "**/build/", fg = "#6272a4" },
	{ url = "**/venv/", fg = "#6272a4" },
	{ url = "**/.env", fg = "#50fa7b" },
	{ url = "**/docker-compose*.{yml,yaml}", fg = "#8be9fd", bold = true },
	{ url = "*.{json,yaml,yml,toml,xml}", fg = "#8be9fd", italic = true },
	{ url = "*.{ini,conf,cfg}", fg = "#6272a4", italic = true },
	{ url = "*.{html,htm}", fg = "#ff79c6", italic = true },
	{ url = "*.{css,scss,sass,less}", fg = "#bd93f9", italic = true },
	{ url = "*.{jsx,tsx}", fg = "#8be9fd", italic = true },
	{ url = "*.{js,ts}", fg = "#f1fa8c", italic = true },
	{ url = "*.vue", fg = "#50fa7b", italic = true },
	{ url = "*.svelte", fg = "#ff5555", italic = true },
	{ url = "*.{py,pyc}", fg = "#50fa7b", italic = true },
	{ url = "*.{rb,erb}", fg = "#ff5555", italic = true },
	{ url = "*.{php,phar}", fg = "#bd93f9", italic = true },
	{ url = "*.{java,jar}", fg = "#ff5555", italic = true },
	{ url = "*.go", fg = "#8be9fd", italic = true },
	{ url = "*.rs", fg = "#ff7043", italic = true },
	{ url = "*.{c,h}", fg = "#bd93f9", italic = true },
	{ url = "*.{cpp,hpp}", fg = "#ff79c6", italic = true },
	{ url = "*.{asm,s}", fg = "#ff5555", italic = true },
	{ url = "*Makefile", fg = "#ff79c6", bold = true },
	{ url = "*CMakeLists.txt", fg = "#ff79c6", bold = true },
	{ url = "*.gradle", fg = "#8be9fd", bold = true },
	{ url = "*.{md,mdx}", fg = "#f1fa8c", italic = true },
	{ url = "*.rst", fg = "#f1fa8c", italic = true },
	{ url = "*.pdf", fg = "#ff5555", bold = true },
	{ url = "*.{jpg,jpeg,png,gif}", fg = "#8be9fd" },
	{ url = "*.{mp4,mkv}", fg = "#bd93f9" },
	{ url = "*.{zip,gz,tar}", fg = "#50fa7b" },
	{ url = "*.{mp3,flac,m4a,wav,ogg}", fg = "#bd93f9", italic = true },
	{ url = "*.{ttf,otf,woff,woff2}", fg = "#ff79c6", italic = true },
	{ url = "*.{sql,sqlite,db}", fg = "#8be9fd", italic = true },
	{ url = "*.{sh,bash,zsh,fish}", fg = "#50fa7b", italic = true },
	{ url = "*.dockerfile", fg = "#8be9fd", bold = true },
	{ url = "*.{pem,crt,ca,key}", fg = "#ff5555", bold = true },
	{ url = "*.{proto}", fg = "#bd93f9", italic = true },
	{ url = "*.{graphql,gql}", fg = "#ff79c6", italic = true },
	{ url = "*.{tf,tfvars}", fg = "#8be9fd", italic = true },
	{ url = "*.{csv,tsv}", fg = "#50fa7b", italic = true },
	{ url = "*.{parquet,avro}", fg = "#bd93f9", italic = true },
	{ url = "*.{pdf,epub,mobi}", fg = "#8be9fd" },
	{ url = "*.{sol}", fg = "#bd93f9", italic = true },
	{ url = "*.{ex,exs}", fg = "#bd93f9", italic = true },
	{ url = "*.{kt,kts}", fg = "#ff79c6", italic = true },
	{ url = "*.{swift}", fg = "#ff5555", italic = true },
	{ url = "*.{nginx,nginx.conf}", fg = "#50fa7b", italic = true },
	{ url = "*{webpack}*", fg = "#8be9fd", bold = true },
	{ url = "*.{ipynb}", fg = "#ff79c6", italic = true },
	{ url = "*.{pkl,pickle}", fg = "#50fa7b", italic = true },
	{ url = "*.{blend}", fg = "#ff79c6", italic = true },
	{ url = "*.{fbx,obj,stl}", fg = "#8be9fd", italic = true },
	{ url = "*.{mp4,mkv,avi,mov}", fg = "#8be9fd" },
	{ mime = "image/*", fg = "#8be9fd" },
	{ mime = "{audio,video}/*", fg = "#bd93f9" },
	{ mime = "application/{zip,tar,gzip,bzip*,7z*,rar,xz,zstd,lzma}", fg = "#50fa7b" },
	{ mime = "vfs/{absent,stale}", fg = "#6272a4" },
	{ url = "*", fg = "#f8f8f2" },
	{ url = "*/", fg = "#bd93f9", bold = true },
]
