#:schema https://yazi-rs.github.io/schemas/yazi.json

# Preview archives with ouch and directories with eza.
# Yazi normalizes MIME subtypes by removing x- and vnd. prefixes.
[plugin]
prepend_previewers = [
	{ mime = "application/{zip,tar,gzip,bzip*,7z*,rar,xz,zstd,lzma,java-archive}", run = "ouch" },
	{ url = "*.{zip,tar,gz,tgz,bz2,tbz,tbz2,xz,txz,zst,tzst,7z,rar,jar}", run = "ouch" },
	{ url = "*/", run = 'piper -- eza -TL=3 --color=always --icons=always --group-directories-first --no-quotes "$1"' },
]

# %s expands to all selected paths; %s1 runs once per selected file.
# Yazi quotes these paths, so do not add shell quotes around placeholders.
[opener]
edit = [
	{ run = "nvim -- %s", block = true, desc = "Edit with Neovim", for = "unix" },
]
extract_ouch = [
	{ run = "ouch d -y -- %s", desc = "Extract with ouch" },
]
open = [
	{ run = "xdg-open %s1", orphan = true, desc = "Open with default app", for = "linux" },
	{ run = "open %s", desc = "Open with default app", for = "macos" },
	{ run = 'start "" %s1', orphan = true, desc = "Open with default app", for = "windows" },
]
image_viewer = [
	{ run = "qview %s", orphan = true, desc = "Open with qView", for = "unix" },
]
play = [
	{ run = "xdg-open %s1", orphan = true, desc = "Play with default app", for = "linux" },
	{ run = "open %s", desc = "Play with default app", for = "macos" },
	{ run = 'start "" %s1', orphan = true, desc = "Play with default app", for = "windows" },
]
reveal = [
	{ run = "xdg-open %d1", orphan = true, desc = "Open parent directory", for = "linux" },
	{ run = "open -R %s1", desc = "Reveal in Finder", for = "macos" },
	{ run = "explorer /select,%s1", orphan = true, desc = "Reveal in Explorer", for = "windows" },
]

# Extend the presets to retain media, empty files, VFS, trash, and fallback rules.
# The first matching rule wins; list openers in the order shown by O.
[open]
prepend_rules = [
	# Keep virtual/trash handling ahead of filename-based rules.
	{ mime = "vfs/{absent,stale}", use = "download" },
	{ mime = "trash/**", use = [ "open", "trash" ] },

	# Images and documents precede text/XML/ZIP detection (SVG, HTML, DOCX).
	{ url = "*.{jpg,jpeg,png,gif,bmp,webp,svg,ico,tif,tiff,avif,heic,heif,jxl}", use = [ "image_viewer", "open", "reveal" ] },
	{ mime = "image/*", use = [ "image_viewer", "open", "reveal" ] },
	{ url = "*.pdf", use = [ "open", "reveal" ] },
	{ mime = "application/pdf", use = [ "open", "reveal" ] },
	{ url = "*.{doc,docx,odt,rtf,xls,xlsx,ods,ppt,pptx,odp,epub}", use = [ "open", "reveal" ] },
	{ url = "*.{html,htm,xhtml}", use = [ "edit", "open", "reveal" ] },

	# Source/config extensions also work when file(1) reports generic binary MIME.
	{ url = "*.{txt,md,markdown,rst,conf,config,ini,log,yml,yaml,toml,json,jsonc,jsonl,ndjson,xml,csv,tsv}", use = [ "edit", "open", "reveal" ] },
	{ url = "*.{sh,bash,zsh,fish,py,pyi,js,mjs,cjs,ts,jsx,tsx,rs,go,c,cc,cpp,cxx,h,hh,hpp,hxx,java,kt,css,scss,vue,svelte,lua,vim,sql}", use = [ "edit", "open", "reveal" ] },
	{ url = "*.{env,properties,gradle,cmake,gitconfig,editorconfig}", use = [ "edit", "open", "reveal" ] },
	{ url = "**/{Makefile,GNUmakefile,Dockerfile,Containerfile,CMakeLists.txt,README,LICENSE,.gitignore,.gitattributes,.gitmodules,.editorconfig,.env*}", use = [ "edit", "open", "reveal" ] },
	{ mime = "application/{yaml,toml,xml,sql,graphql,typescript,shellscript,sh}", use = [ "edit", "open", "reveal" ] },

	# MIME names here are the normalized names used by current Yazi.
	{ mime = "application/{zip,tar,gzip,bzip*,7z*,rar,xz,zstd,lzma,java-archive}", use = [ "extract_ouch", "extract", "open", "reveal" ] },
	{ url = "*.{zip,tar,gz,tgz,bz2,tbz,tbz2,xz,txz,zst,tzst,7z,rar,jar}", use = [ "extract_ouch", "extract", "open", "reveal" ] },
]
