onboarding = false
[keys]
prefix = "alt+h"
navigate_workspace_up = "shift+k"
navigate_workspace_down = "shift+j"
help = "prefix+?"
settings = "prefix+g"
detach = "prefix+d"
reload_config = "prefix+r"
open_notification_target = "prefix+shift+o"
workspace_picker = "prefix+a"
goto = "prefix+w"
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+s"
rename_workspace = "prefix+$"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
new_tab = "prefix+c"
rename_tab = "prefix+comma"
previous_tab = "prefix+p"
next_tab = ["prefix+n", "prefix+ctrl+n"]
switch_tab = "prefix+1..9"
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"
close_tab = ["prefix+ampersand", "prefix+shift+w"]
edit_scrollback = ["prefix+v", "prefix+["]
focus_pane_left = ["prefix+h", "prefix+ctrl+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+ctrl+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+ctrl+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+ctrl+l", "prefix+right"]
swap_pane_left = "prefix+ctrl+shift+h"
swap_pane_down = "prefix+}"
swap_pane_up = "prefix+{"
swap_pane_right = "prefix+ctrl+shift+l"
cycle_pane_next = "prefix+o"
last_pane = "prefix+semicolon"
split_vertical = ["prefix+|", "prefix+%"]
split_horizontal = ["prefix+minus", "prefix+\""]
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "open Sesh workspace picker"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
prompt_new_tab_name = false
pane_borders = "always"
pane_outer_borders = true
pane_scrollbars = true
pane_gaps = false
status_indicators = "dots"
tab_bar_position = "top"
window_title = "{workspace}"

[ui.sidebar.agents]
rows = [
  [
    { token = "state_icon" },
    { token = "agent", fg = "#8be9fd",  dim = false },
  ],
  [ "$topic" ],
]

[theme]
name = "dracula"
auto_switch = false

[ui.toast]
delivery = "system"

[update]
channel = "stable"

[terminal]
kitty_graphics = true
